name: smoke

# Runs the Playwright smoke suite on every push and PR. Catches the
# regression class we kept fixing by hand: a chart that renders blank,
# a KPI stuck at "—", a JS console error from schema drift, or an /api/*
# endpoint returning the wrong shape.
#
# Test failures block the PR but don't block the HF Spaces deploy
# (HF watches the repo independently). To redeploy only on green,
# move HF Spaces to a deploy-key + push step gated on this job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Opt into Node 24 early so the v4/v5 JS-action wrappers don't keep
# emitting the "Node.js 20 actions are deprecated" annotation on every
# run. Action authors haven't shipped Node-24-targeted v5+ majors yet —
# this env var tells the runner to execute the existing v4/v5 actions
# under Node 24 anyway, which is the path GitHub itself recommends.
# Remove this once actions/checkout@v5 etc. ship with native Node-24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install httptools playwright pytest pytest-playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start dashboard
        env:
          # FastAPI reads these from env. Tests can hit the public
          # endpoints without ACLED credentials — the JSON fallbacks
          # cover the test data.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY:  ${{ secrets.EIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Run uvicorn directly (no reload). dev_server.py uses reload=True
          # which spawns a parent reloader + worker child — when GitHub
          # Actions starts the next step's shell, the reloader child can
          # get orphaned and die, leaving subsequent test requests hitting
          # nothing on :8765. Plain uvicorn one-process is reliable here.
          # nohup + setsid detaches the process from this step's shell.
          nohup setsid python -m uvicorn app:app \
              --host 127.0.0.1 --port 8765 \
              --http httptools --log-level warning \
              > /tmp/dashboard.log 2>&1 &
          echo "started dashboard PID=$!"
          # Wait up to 90s for the server to become responsive (cold-start
          # has to warm Brent, FRED, IMF PortWatch, HDX, news scraper).
          for i in $(seq 1 90); do
            if curl -fs http://127.0.0.1:8765/api/health > /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start within 90s" >&2
          tail -200 /tmp/dashboard.log >&2
          exit 1
      - name: Run smoke tests
        env:
          DASHBOARD_URL:    http://127.0.0.1:8765
          PYTHONUNBUFFERED: "1"
        # --tb=long + -v dumps the full traceback for any failing test
        # into the step's stdout, so the GitHub Actions UI shows the
        # actual assertion that broke. -rA shows the short summary for
        # all outcomes (passed/failed/skipped/xfail) so the email's
        # foldable "Run smoke tests" log section ends with a complete
        # list rather than just the first failure. Output is also tee'd
        # to a file so it gets uploaded as an artifact alongside the
        # dashboard log — public-API artifact downloads remain auth-
        # gated, but the file is at least retrievable from the run page.
        run: |
          set -o pipefail
          pytest tests/test_smoke.py -v --tb=long -rA --maxfail=15 \
              2>&1 | tee /tmp/pytest.log
      - name: Dump dashboard log on failure
        if: failure()
        run: |
          echo "::group::dashboard.log (last 300 lines)"
          tail -300 /tmp/dashboard.log || echo "(no log)"
          echo "::endgroup::"
          echo "::group::pytest.log (last 200 lines)"
          tail -200 /tmp/pytest.log || echo "(no log)"
          echo "::endgroup::"
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/dashboard.log
            /tmp/pytest.log
